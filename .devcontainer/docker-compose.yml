services:
  dev:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    volumes:
      - ..:/workspaces/farmared:cached
      - python_env:/opt/farmared-venv
    environment:
      MONGO_URI: "mongodb://mongodb:27017/?replicaSet=rs0"
      MONGO_DB: "${MONGO_DB:-farmared}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Falta NEO4J_PASSWORD}"
      DB_TIMEOUT_MS: "${DB_TIMEOUT_MS:-10000}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

volumes:
  python_env:
