[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "farmared"
version = "0.1.0"
description = "FarmaRed — TPO de Bases de Datos II"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pymongo==4.19.0",
    "neo4j==6.4.1",
    "tzdata==2026.6",
]

[project.scripts]
farmared = "farmared.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/farmared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
