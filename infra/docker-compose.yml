services:
  mongodb:
    image: mongo:8.0.15@sha256:f4d54619262ae3bc6a0a8efbebcef970b87b8ad70697479a75ce308a6f400158
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--eval", "const h = db.adminCommand({hello: 1}); quit(h.isWritablePrimary && h.setName === 'rs0' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  mongodb-init:
    image: mongo:8.0.15@sha256:f4d54619262ae3bc6a0a8efbebcef970b87b8ad70697479a75ce308a6f400158
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - ./mongo/init-replica.js:/scripts/init-replica.js:ro
    command: ["mongosh", "--nodb", "--quiet", "/scripts/init-replica.js"]
    restart: "no"

  neo4j:
    image: neo4j:5.26.12-community@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Ejecutar python3 infra/preparar_env.py o definir NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "NEO4J_USERNAME=neo4j NEO4J_PASSWORD=\"$${NEO4J_AUTH#*/}\" cypher-shell -a bolt://localhost:7687 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1536m

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:
